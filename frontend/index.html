<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess AI Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <header>
          <h1>Chess vs AI</h1>
          <button id="new-game" type="button">New Game</button>
        </header>
        <div id="status-bar">
          <p id="turn-label">Loading…</p>
          <p id="game-status">Connecting to server…</p>
        </div>
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        <section class="log">
          <h2>Move Log</h2>
          <ol id="move-log"></ol>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
